*, *::before, *::after { box-sizing: border-box; }

<style>
/* Layout: the printed Dolce Vita carta carried to the phone — linen paper, the
   tinted logo band, letter-spaced section heads over a hairline, dish left / price right. */
:root {
  --paper: #FBF8F2;      /* page */
  --band: #F3ECE2;       /* logo band, dividers */
  --ink: #000000;        /* dish & drink names */
  --ink-soft: #21190F;   /* descriptions */
  --ink-muted: #6E604F;  /* intro, notes */
  --brand: #7A3E1E;      /* "Dolce Vita" */
  --head: #B07850;       /* section titles */
  --gold: #B89A72;       /* prices, rules */
  --line: #E9DFD1;       /* hairlines */
  --chip-on-bg: #C99A6E;
  --chip-on-fg: #FFFFFF;
  color-scheme: light;
  --display: "Lora", Georgia, "Times New Roman", serif;
  --ui: "Poppins", "Helvetica Neue", Arial, sans-serif;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--display);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--band);
}
.gutter {
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin-inline: auto; }
.logo { display: block; color: var(--brand); height: auto; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--head); outline-offset: 3px; border-radius: 4px; }

/* ---------- Language gate ---------- */
.gate {
  min-height: calc(100svh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-rows: minmax(min-content, 44svh) auto 1fr;
  background: var(--paper);
}
.gate-band { background: var(--band); padding-block: 40px 30px; display: grid; align-content: center; }
.gate-band .wrap { display: grid; justify-items: center; gap: 14px; }
.gate .logo { width: min(80vw, 360px); }
.tagline {
  font-family: var(--ui); font-weight: 300; font-size: 12.5px; letter-spacing: .04em;
  color: var(--head); display: flex; gap: 10px; align-items: center;
}
.gate-rules { display: grid; gap: 6px; }
.gate-rules span { display: block; height: 0; border-top: .75px solid var(--gold); }
.gate-rules span:last-child { border-top-width: .5px; }
.gate-body { padding-block: clamp(22px, 4svh, 36px) 16px; }
.gate-body .wrap { display: grid; justify-items: center; gap: 28px; text-align: center; }
.benvenuti { font-style: italic; font-size: 30px; color: var(--ink); margin: 0; font-weight: 400; }
.choose {
  font-family: var(--ui); font-size: 10.5px; font-weight: 500; letter-spacing: .32em;
  text-transform: uppercase; color: var(--head); margin: -14px 0 0;
}
.langs { display: grid; gap: 12px; width: min(100%, 340px); }
.lang {
  min-height: 64px;
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px;
  text-align: left; cursor: pointer; background: transparent;
  border: .75px solid var(--gold); border-radius: 2px; padding: 16px 18px;
  transition: background-color .2s ease, border-color .2s ease;
}
@media (hover: hover) { .lang:hover { background: var(--band); } .switch-lang:hover { background: var(--paper); } }
.lang:active { background: var(--band); }
.lang b { font-family: var(--display); font-weight: 400; font-size: 21px; color: var(--ink); }
.lang small { grid-column: 1; font-family: var(--ui); font-weight: 300; font-size: 11.5px; color: var(--ink-muted); letter-spacing: .02em; }
.lang i { grid-row: 1 / span 2; grid-column: 2; font-style: normal; font-family: var(--ui); font-size: 11px; letter-spacing: .2em; color: var(--gold); }
.gate-foot { align-self: end; padding-block: 10px 26px; text-align: center; font-style: italic; font-size: 12.5px; color: var(--ink-muted); }

/* ---------- Menu ---------- */
.top { background: var(--band); padding-block: 22px 0; }
.top .wrap { display: grid; justify-items: center; gap: 10px; }
.top .logo { width: min(58vw, 260px); }
.top .gate-rules { width: 100%; margin-top: 18px; }
.switch-lang {
  position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px);
  right: max(14px, env(safe-area-inset-right, 0px));
  font-family: var(--ui); font-size: 11px; font-weight: 500; letter-spacing: .14em;
  background: transparent; border: .75px solid var(--gold); color: var(--head);
  border-radius: 999px; padding: 0 14px; min-height: 36px; min-width: 48px; cursor: pointer;
}

.intro {
  font-style: italic; font-size: 14.5px; line-height: 1.6; color: var(--ink-muted);
  text-align: center; text-wrap: balance; margin: 22px auto 4px; max-width: 34em;
}

.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper); border-bottom: .5px solid var(--line);
  padding-block: 10px 0;
}
.tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: .5px solid var(--line); }
.tab {
  background: transparent; border: 0; cursor: pointer; padding: 8px 0 11px; min-height: 52px;
  font-family: var(--display); font-style: italic; font-size: 19px; color: var(--ink-muted);
  position: relative;
}
.tab[aria-selected="true"] { color: var(--brand); }
.tab[aria-selected="true"]::after {
  content: ""; position: absolute; left: 50%; bottom: -1px; width: 44px; height: 1.5px;
  transform: translateX(-50%); background: var(--brand);
}
.tab span { font-family: var(--ui); font-style: normal; font-size: 9.5px; letter-spacing: .26em; color: var(--head); display: block; margin-top: 2px; text-transform: uppercase; }
.chips {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  padding-block: 10px 11px; scroll-padding-inline: 18px; scroll-snap-type: x proximity; overscroll-behavior-x: contain;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 22px), transparent);
          mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 22px), transparent);
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; cursor: pointer; background: transparent; color: var(--head);
  border: .75px solid var(--line); border-radius: 999px; padding: 0 15px; min-height: 36px; scroll-snap-align: start;
  font-family: var(--ui); font-size: 10.5px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase;
  transition: background-color .2s, color .2s, border-color .2s;
}
.chip[aria-current="true"] { background: var(--chip-on-bg); color: var(--chip-on-fg); border-color: var(--chip-on-bg); }

main { padding-block: 8px 24px; }
.section { padding-top: 30px; scroll-margin-top: calc(var(--navh, 120px) + env(safe-area-inset-top, 0px) - 18px); }
.section h2 {
  margin: 0 0 6px; text-align: center; font-family: var(--ui); font-weight: 500;
  font-size: 11px; letter-spacing: .34em; color: var(--head); text-transform: uppercase;
  padding-bottom: 9px; border-bottom: .5px solid var(--gold);
}
.list { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 14px; padding: 13px 0; }
.item + .item { border-top: .5px solid var(--line); }
.name { font-size: 16.5px; line-height: 1.3; color: var(--ink); text-wrap: balance; }
.section.cucina .name { text-transform: uppercase; letter-spacing: .03em; font-size: 15.5px; }
.price {
  font-family: var(--ui); font-weight: 500; font-size: 14px; color: var(--gold);
  font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 2px;
}
.desc { grid-column: 1 / -1; font-style: italic; font-size: 14px; line-height: 1.45; color: var(--ink-soft); margin-top: 3px; padding-left: 3px; }
.variants { grid-column: 1 / -1; font-family: var(--ui); font-size: 10px; font-weight: 400; letter-spacing: .18em; text-transform: uppercase; color: var(--head); margin-top: 4px; padding-left: 3px; }

.wine-head, .wine { display: grid; grid-template-columns: minmax(0, 1fr) 64px 64px; column-gap: 8px; align-items: baseline; }
.wine-head { padding: 10px 0 2px; font-family: var(--ui); font-weight: 300; font-size: 11px; color: var(--ink-muted); }
.wine-head span, .wine .price { text-align: right; }
.wine { padding: 9px 0; }
.wine + .wine { border-top: .5px solid var(--line); }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 26px; }
.grid2 .item:nth-child(2) { border-top: 0; }
@media (max-width: 420px) {
  .grid2 { grid-template-columns: 1fr; }
  .grid2 .item:nth-child(2) { border-top: .5px solid var(--line); }
}

.group-mark { display: grid; justify-items: center; gap: 8px; padding-top: 44px; color: var(--head); }
.group-mark em { font-size: 26px; color: var(--brand); }
.group-mark small { font-family: var(--ui); font-size: 9.5px; letter-spacing: .3em; text-transform: uppercase; }

.notes { margin-top: 46px; padding-block: 22px 96px; border-top: .5px solid var(--gold); text-align: center; display: grid; gap: 6px; }
.notes p { margin: 0; font-style: italic; font-size: 13px; line-height: 1.5; color: var(--ink-muted); }
.notes .fine { font-style: normal; font-family: var(--ui); font-weight: 300; font-size: 11px; color: var(--head); margin-top: 8px; }
.notes .salute { font-size: 22px; color: var(--brand); margin-top: 14px; }

.to-top {
  position: fixed; z-index: 6; width: 46px; height: 46px; border-radius: 50%;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: grid; place-items: center; cursor: pointer;
  background: var(--paper); color: var(--head); border: .75px solid var(--gold);
  box-shadow: 0 6px 18px -8px rgba(80, 50, 25, .35);
  opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .25s, transform .25s;
}
.to-top.show { opacity: 1; transform: none; pointer-events: auto; }
.to-top svg { width: 16px; height: 16px; }
@media (min-width: 720px) {
  .name { font-size: 17px; }
  
}
@media (prefers-reduced-motion: no-preference) {
  .rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .rise.d2 { animation-delay: .12s; } .rise.d3 { animation-delay: .24s; }
  @keyframes rise { from { opacity: .001; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}
</style>

</head>

    ['Té caliente / frío', 'Hot / Iced Tea', 70], ['Leche', 'Milk', 60], ['Latte e Caffè', null, 80],
  ]},
  { id: 'bebidas', g: 'bar', t: ['Bebidas', 'Beverages'], items: [
    ['Agua natural / mineral', 'Still / Sparkling Water', 50],
    ['San Pellegrino 250 ml', null, 70], ['San Pellegrino 500 ml', null, 90], ['San Pellegrino 750 ml', null, 140],
    ['Limonada / Naranjada', 'Lemonade / Orangeade', 60], ['Piñada', 'Piñada (Pineapple Drink)', 120], ['Smoothies', null, 130],
    ['Coca Cola', null, 70], ['Coca Cola Zero', null, 70], ['Coca Cola Light', null, 70], ['Fanta', null, 70], ['Sprite', null, 70],
    ['Agua tónica', 'Tonic Water', 70],
  ]},
];

let lang = null, group = 'cucina';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = (p) => p === 'MP' ? T[lang].mp : '$ ' + p;
const L = (es, en) => (lang === 'en' && en) ? en : es;

function itemHTML(it) {
  const [nes, nen, p, des, den] = it;
  const d = L(des, den);
  return `<li class="item"><span class="name">${esc(L(nes, nen))}</span><span class="price">${money(p)}</span>${d ? `<span class="desc">${esc(d)}</span>` : ''}</li>`;
}
function sectionHTML(s) {
  const title = esc(L(s.t[0], s.t[1]));
  let body;
  if (s.kind === 'wine') {
    body = `<div class="wine-head"><span></span><span>${T[lang].glass}</span><span>${T[lang].bottle}</span></div>` +
      s.items.map(([n, g, b]) => `<div class="wine"><span class="name">${esc(n)}</span><span class="price">${g ? money(g) : ''}</span><span class="price">${money(b)}</span></div>`).join('');
  } else {
    body = `<ul class="list${s.kind === 'grid' ? ' grid2' : ''}">${s.items.map(itemHTML).join('')}</ul>`;
  }
  return `<section class="section ${s.g}" id="sec-${s.id}" data-id="${s.id}"><h2>${title}</h2>${body}</section>`;
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  $('#intro').textContent = t.intro;
  $('#switch-lang').textContent = t.switchTo;
  $('#switch-lang').setAttribute('aria-label', lang === 'es' ? 'View the menu in English' : 'Ver la carta en español');
  $('#tab-cucina-sub').textContent = t.cucina;
  $('#tab-bar-sub').textContent = t.bar;
  toTop.setAttribute('aria-label', lang === 'es' ? 'Volver arriba' : 'Back to top');
  for (const b of document.querySelectorAll('.tab')) b.setAttribute('aria-selected', String(b.dataset.group === group));
  const secs = MENU.filter((s) => s.g === group);
  $('#chips').innerHTML = secs.map((s, i) => `<button class="chip" data-target="${s.id}"${i === 0 ? ' aria-current="true"' : ''}>${esc(L(s.t[0], s.t[1]))}</button>`).join('');
  $('#content').innerHTML = secs.map(sectionHTML).join('') +
    `<footer class="notes">${t.notes.map((n) => `<p>${esc(n)}</p>`).join('')}<p class="fine">${esc(t.fine)}</p><p class="salute">Buon appetito</p></footer>`;
  navH();
  observe();
}

let io;
function observe() {
  if (io) io.disconnect();
  if (!('IntersectionObserver' in window)) return;
  io = new IntersectionObserver((entries) => {
    const vis = entries.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
    if (!vis.length) return;
    setChip(vis[0].target.dataset.id);
  }, { rootMargin: `-${navH() + 4}px 0px -55% 0px` });
  document.querySelectorAll('.section').forEach((s) => io.observe(s));
}
function setChip(id) {
  document.querySelectorAll('.chip').forEach((c) => {
    const on = c.dataset.target === id;
    if (on && c.getAttribute('aria-current') !== 'true') {
      c.setAttribute('aria-current', 'true');
      const box = c.parentElement;
      box.scrollTo({ left: c.offsetLeft - box.clientWidth / 2 + c.clientWidth / 2, behavior: 'smooth' });
    } else if (!on) c.removeAttribute('aria-current');
  });
}

function open(l, push = true) {
  lang = l;
  try { localStorage.setItem('dv-lang', l); } catch (e) {}
  $('#gate').hidden = true; $('#menu').hidden = false;
  render();
  if (push && location.hash !== '#' + l) location.hash = l;
  window.scrollTo(0, 0);
}
function showGate() { $('#menu').hidden = true; $('#gate').hidden = false; lang = null; }

document.querySelectorAll('.lang').forEach((b) => b.addEventListener('click', () => open(b.dataset.lang)));
$('#switch-lang').addEventListener('click', () => {
  const y = window.scrollY; open(lang === 'es' ? 'en' : 'es'); window.scrollTo(0, Math.min(y, document.body.scrollHeight));
});
document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => {
  if (group === b.dataset.group) return;
  group = b.dataset.group; render();
  const nav = document.querySelector('.nav');
  window.scrollTo({ top: Math.max(0, nav.offsetTop - 1), behavior: 'smooth' });
}));
$('#chips').addEventListener('click', (e) => {
  const c = e.target.closest('.chip'); if (!c) return;
  setChip(c.dataset.target);
  document.getElementById('sec-' + c.dataset.target).scrollIntoView({ behavior: 'smooth', block: 'start' });
});
function navH() {
  const n = document.querySelector('.nav'); const h = n ? n.offsetHeight : 120;
  document.documentElement.style.setProperty('--navh', h + 'px'); return h;
}
const toTop = $('#to-top');
let ticking = false;
window.addEventListener('scroll', () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => { toTop.classList.toggle('show', !$('#menu').hidden && window.scrollY > 700); ticking = false; });
}, { passive: true });
toTop.addEventListener('click', () => {
  const nav = document.querySelector('.nav');
  window.scrollTo({ top: Math.max(0, nav.offsetTop - 1), behavior: 'smooth' });
});
window.addEventListener('resize', () => { if (lang) { navH(); observe(); } });
function route() {
  const h = location.hash.replace('#', '');
  if (h === 'es' || h === 'en') { if (lang !== h) open(h, false); }
  else showGate();
}
window.addEventListener('hashchange', route);
route();
</script>

</body>
</html>
